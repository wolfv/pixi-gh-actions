context:
  owner: actions
  repo: checkout
  version: "4.2.2"

package:
  name: gh-action-actions-checkout
  version: ${{ version }}

source:
  url: https://github.com/actions/checkout/archive/refs/tags/v4.2.2.tar.gz
  sha256: da55487936ad3c29dafe8ffa5bea7dc5cbea38775f8bb1026ebaf9461e684ab1

build:
  number: 0
  # build.sh / bld.bat live in the same directory as this recipe.yaml
  script: build.sh

requirements:
  # No Python or PyYAML — entry points are shell scripts that invoke node directly.
  run:
    - nodejs >=20

tests:
  - package_contents:
      files:
        - share/gh-actions/actions/checkout/action.yml
  - script:
      - checkout --help

about:
  homepage: https://github.com/actions/checkout
  license: MIT
  summary: "GitHub Action: Checkout"
  description: |
    Checkout a Git repository at a particular version
